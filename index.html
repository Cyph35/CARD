  main { max-width: 430px; margin: 0 auto; padding-bottom: calc(40px + env(safe-area-inset-bottom)); }
  .photo {
    display: block; width: 100%; aspect-ratio: 390 / 400; object-fit: cover; object-position: 50% 0%;
    -webkit-mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
            mask-image: linear-gradient(to bottom, #000 55%, transparent 100%);
  }
  header { margin-top: -36px; padding: 0 24px; text-align: center; position: relative; }
  h1 { margin: 0; font-size: 42px; line-height: .98; font-weight: 500; letter-spacing: -.035em; }
  .role { margin: 10px 0 0; font-size: 16px; color: var(--muted); }
  .save {
    margin: 28px 24px 0; display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 54px; border-radius: 14px; background: var(--fg); color: #000;
    font-size: 16px; font-weight: 600; letter-spacing: -.01em; text-decoration: none;
    transition: background-color .15s;
  }
  .save:hover { background: #fff; }
  nav {
    margin: 20px 24px 0; padding: 0 12px; background: rgba(0,0,0,.82);
    border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  }
  .row {
    display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 0 4px;
    color: var(--fg); text-decoration: none; border-top: 1px solid var(--line);
  }
  .row:first-child { border-top: 0; }
  .row svg { flex: none; }
  .row div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .label { font-size: 15px; font-weight: 500; }
  .value { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .save:focus-visible, .row:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  @media (hover: hover) { .row:hover .value { color: var(--fg); } }
</style>
